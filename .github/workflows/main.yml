name: Daily AI Trading Bot Run

on:
  schedule:
    # यह टाइमिंग हर सोमवार से शुक्रवार रात 8:30 PM (भारतीय समयानुसार) बोट को चलाएगी
    - cron: '30 15 * * 1-5'
  workflow_dispatch: # इससे आप जब चाहें खुद भी बटन दबाकर रन कर सकते हैं

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4 # 👈 v3 की जगह v4 किया (यह Node 24 को सपोर्ट करता है)

      - name: Setup Python
        uses: actions/setup-python@v5 # 👈 v4 की जगह v5 किया (यह Node 24 को सपोर्ट करता है)
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install google-generativeai pandas yfinance requests

      - name: Run Multi-Agent Bot
        env:
          GEMINI_API_KEY: ${{ AQ.Ab8RN6KE5Ys5HNbGVA_SLKNmRmLLsNBK4WWO3X80OJvi3cJCaQ }}
          TELEGRAM_TOKEN: ${{ 8920263056: AAH1R04B3WbsA4s9pssewE-
kAvok0Ru6e90 }}
          TELEGRAM_CHAT_ID: ${{ 1002663281 }}
          ALPACA_KEY: ${{ PKTZZG7SCWXCTLWCSP6Z3RISKA }}
          ALPACA_SECRET: ${{ ExbAjYPtVtqo3m2KDvXSnyWGdbeWn }}
        run: python trading_bot.py
        
