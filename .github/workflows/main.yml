name: Daily AI Trading Bot Run

on:
  schedule:
    - cron: '30 15 * * 1-5'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2 # 👈 बिल्कुल सटीक और नया सब-वर्जन

      - name: Setup Python
        uses: actions/setup-python@v5.4.0 # 👈 बिल्कुल सटीक और नया सब-वर्जन
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install google-generativeai pandas yfinance requests

      - name: Run Multi-Agent Bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
        run: python trading_bot.py
        
